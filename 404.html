<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting to WSMS...</title>
    <script>
      // Single-Page Apps for GitHub Pages: redirect 404 back to root index.html preserving URL
      (function() {
        var path = window.location.pathname;
        var segments = path.split('/').filter(Boolean);
        var repo = segments.length > 0 ? segments[0] : '';
        // If hosted on username.github.io/repo/
        var isGitHubPages = window.location.hostname.endsWith('github.io');
        var base = window.location.origin + (isGitHubPages && repo ? '/' + repo + '/' : '/');
        window.location.replace(base + 'index.html' + window.location.search + window.location.hash);
      })();
    </script>
  </head>
  <body style="font-family:'Inter',system-ui,sans-serif;text-align:center;padding:50px;background:#f7f9fb;color:#0077cc;">
    <div style="max-width:420px;margin:40px auto;background:#fff;padding:28px;border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,0.06);border:1px solid #eef2f7;">
      <h3 style="margin-top:0;color:#0077cc;font-size:18px;">Redirecting to WSMS...</h3>
      <p style="color:#666;font-size:14px;line-height:1.5;">Please wait while we redirect you to the application.</p>
      <div style="margin-top:16px;">
        <a href="./index.html" style="display:inline-block;background:#0077cc;color:#fff;padding:10px 20px;border-radius:8px;text-decoration:none;font-weight:600;font-size:13px;">Click here if not redirected</a>
      </div>
    </div>
  </body>
</html>
