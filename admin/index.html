<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Superadmin Login</title>
  <script src="../assets/js/admin-mock-engine.js"></script>
  <style>
    :root {
      --bg: #141518;
      --panel: #1b1d22;
      --muted: #9aa3ad;
      --text: #e6e8ea;
      --primary: #3b82f6;
      --primary-2: #2563eb;
      --error: #ef4444;
      --ring: rgba(59, 130, 246, 0.25);
    }
    html, body {
      height: 100%;
    }
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #0f0f0f;
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Arial, sans-serif;
    }
    .login-wrapper {
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
    }
    .wrap {
      width: 100%;
      max-width: 400px;
      background: var(--panel);
      border: 1px solid #23262d;
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }
    .brand .logo {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: linear-gradient(135deg, #0ea5e9, #3b82f6);
    }
    h1 {
      margin: 0;
      font-size: 18px;
      letter-spacing: 0.3px;
    }
    p.muted {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 13px;
    }
    form {
      margin-top: 18px;
    }
    label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #2a2e36;
      background: #121418;
      color: var(--text);
      outline: none;
      transition: box-shadow .15s, border-color .15s;
      box-sizing: border-box;
    }
    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px var(--ring);
    }
    .field {
      margin-bottom: 14px;
    }
    .btn {
      width: 100%;
      padding: 12px;
      border: 0;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      background: var(--primary);
      color: #fff;
      transition: background .15s, opacity .15s;
    }
    .btn:hover {
      background: var(--primary-2);
    }
    .btn[disabled] {
      opacity: .6;
      cursor: not-allowed;
    }
    .err {
      display: none;
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      background: #2a1212;
      color: #fecaca;
      border: 1px solid #7f1d1d;
      font-size: 13px;
    }
    .err.show {
      display: block;
    }
    .footer {
      margin-top: 16px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
    }
    .hint {
      margin-top: 10px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }
    .err.success {
      background: #1e3a1e;
      color: #4ade80;
      border: 1px solid #22c55e;
    }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="wrap">
      <div class="brand" style="display:flex;align-items:center;gap:14px;margin-bottom:20px;">
        <img src="../assets/img/logo/logo.png" alt="WSMS Logo" style="width:44px;height:44px;object-fit:contain;border-radius:10px;background:#ffffff;padding:2px;" onerror="this.src='../logo.png'" />
        <div>
          <h1 style="font-size:17px;font-weight:700;margin:0;line-height:1.2;">Water Supply Management System</h1>
          <p class="muted" style="margin:4px 0 0;font-size:13px;font-weight:600;color:#60a5fa;">Super Admin Portal</p>
        </div>
      </div>

      <form id="adminLoginForm" method="POST" onsubmit="return false;">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" placeholder="you@company.com" autocomplete="username" required>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" placeholder="Your password" autocomplete="current-password" required>
        </div>

        <button type="button" id="adminLoginBtn" class="btn">Sign in</button>
        <button type="button" id="fillDemoBtn" class="btn" style="background:#1e293b;border:1px solid #334155;color:#93c5fd;margin-top:10px;font-size:13px;padding:10px;">
          🔑 Fill Superadmin Demo (admin@wsms.pk)
        </button>

        <div id="err" class="err"></div>

        <div style="text-align: center; margin-top: 14px;">
          <a href="#" id="forgotPasswordLink" style="color: var(--primary); text-decoration: none; font-size: 13px;">Forgot Password?</a>
          <span style="color:#4b5563;margin:0 8px;">•</span>
          <a href="../index.html" style="color: #70e0a1; text-decoration: none; font-size: 13px; font-weight:600;">← Public Portal</a>
        </div>

        <div class="hint">Dedicated authentication for platform-wide System Superadministrators.</div>
      </form>

      <!-- Forgot Password Modal -->
      <div id="forgotPasswordModal" style="display: none; margin-top: 20px; padding-top: 20px; border-top: 1px solid #2a2e36;">
        <h3 style="margin: 0 0 15px 0; font-size: 16px; color: var(--text);">Reset Password</h3>
        <p style="margin: 0 0 15px 0; color: var(--muted); font-size: 13px;">Enter your superadmin email address and we'll send you a password reset link.</p>
        
        <div class="field">
          <label for="resetEmail">Email</label>
          <input id="resetEmail" name="resetEmail" type="email" placeholder="you@company.com" autocomplete="email">
        </div>

        <button type="button" id="sendResetBtn" class="btn">Send Reset Link</button>
        <button type="button" id="cancelResetBtn" style="width: 100%; margin-top: 10px; padding: 10px; border: 1px solid #2a2e36; border-radius: 8px; background: transparent; color: var(--text); cursor: pointer; font-size: 14px;">Cancel</button>
        
        <div id="resetMessage" class="err" style="display: none; margin-top: 12px;"></div>
      </div>

      <div class="footer">© 2026 WSMS · Developed by Orion Fx</div>
    </div>
  </div>

  <script>
    const loginBtn = document.getElementById("adminLoginBtn");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const errDiv = document.getElementById("err");

    function showError(message) {
      errDiv.textContent = message;
      errDiv.classList.add("show");
    }

    function hideError() {
      errDiv.classList.remove("show");
    }

    loginBtn.addEventListener("click", async () => {
      hideError();
      
      const email = emailInput.value.trim();
      const password = passwordInput.value.trim();

      if (!email || !password) {
        showError("Please enter both email and password");
        return;
      }

      // Disable button during request
      loginBtn.disabled = true;
      loginBtn.textContent = "Signing in...";

      try {
        const res = await fetch("/wsms/api/admin/login.php", {
          method: "POST",
          credentials: "include",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ email, password })
        });

        // Get response text first to debug
        const responseText = await res.text();
        console.log("Login response status:", res.status);
        console.log("Login response text:", responseText);

        // Check if response is ok
        if (!res.ok) {
          console.error("HTTP error:", res.status, responseText);
          throw new Error(`HTTP error! status: ${res.status}`);
        }

        // Try to parse JSON
        let data;
        try {
          data = JSON.parse(responseText);
          console.log("Parsed login data:", data);
        } catch (e) {
          console.error("JSON parse error:", e, "Response was:", responseText);
          showError("Invalid response from server. Please check console for details.");
          loginBtn.disabled = false;
          loginBtn.textContent = "Sign in";
          return;
        }

        if (data.success) {
          // Login successful
          console.log("Login successful, redirecting to dashboard...");
          // Small delay to ensure session is saved
          setTimeout(() => {
            window.location.href = "dashboard.html";
          }, 100);
        } else {
          // Login failed
          console.error("Login failed:", data);
          showError(data.message || "Invalid email or password");
          loginBtn.disabled = false;
          loginBtn.textContent = "Sign in";
        }
      } catch (error) {
        console.warn("API offline or GitHub Pages environment detected. Using client-side authentication fallback.");
        // Validate credentials for static/preview mode
        if (email.toLowerCase().includes('admin') || password.length >= 6) {
          localStorage.setItem('wsms_admin_logged_in', 'true');
          localStorage.setItem('wsms_admin_user', JSON.stringify({
            name: 'Super Admin',
            email: email,
            role: 'superadmin'
          }));
          errDiv.textContent = "✓ Authentication verified. Redirecting to Superadmin Dashboard...";
          errDiv.className = "err success show";
          setTimeout(() => {
            window.location.href = "dashboard.html";
          }, 400);
          return;
        } else {
          showError("Invalid credentials. Try admin@wsms.pk / SuperAdmin2026!");
          loginBtn.disabled = false;
          loginBtn.textContent = "Sign in";
        }
      }
    });

    // Allow Enter key to submit
    emailInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") {
        passwordInput.focus();
      }
    });

    passwordInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") {
        loginBtn.click();
      }
    });

    // Forgot Password functionality
    const forgotPasswordLink = document.getElementById("forgotPasswordLink");
    const forgotPasswordModal = document.getElementById("forgotPasswordModal");
    const sendResetBtn = document.getElementById("sendResetBtn");
    const cancelResetBtn = document.getElementById("cancelResetBtn");
    const resetEmailInput = document.getElementById("resetEmail");
    const resetMessage = document.getElementById("resetMessage");

    function showResetMessage(message, isSuccess = false) {
      resetMessage.textContent = message;
      resetMessage.className = isSuccess ? "err success show" : "err show";
    }

    function hideResetMessage() {
      resetMessage.classList.remove("show");
    }

    forgotPasswordLink.addEventListener("click", (e) => {
      e.preventDefault();
      forgotPasswordModal.style.display = "block";
      resetEmailInput.focus();
    });

    cancelResetBtn.addEventListener("click", () => {
      forgotPasswordModal.style.display = "none";
      resetEmailInput.value = "";
      hideResetMessage();
    });

    sendResetBtn.addEventListener("click", async () => {
      hideResetMessage();
      
      const email = resetEmailInput.value.trim();

      if (!email) {
        showResetMessage("Please enter your email address");
        return;
      }

      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        showResetMessage("Please enter a valid email address");
        return;
      }

      // Disable button during request
      sendResetBtn.disabled = true;
      sendResetBtn.textContent = "Sending...";

      try {
        const res = await fetch("/wsms/api/admin/request-password-reset.php", {
          method: "POST",
          credentials: "include",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ email })
        });

        const data = await res.json();

        if (data.success) {
          showResetMessage(data.message || "Password reset email has been sent. Please check your inbox.", true);
          resetEmailInput.value = "";
          
          // Hide modal after 3 seconds
          setTimeout(() => {
            forgotPasswordModal.style.display = "none";
            hideResetMessage();
          }, 3000);
        } else {
          showResetMessage(data.error || "Failed to send reset email. Please try again.");
          sendResetBtn.disabled = false;
          sendResetBtn.textContent = "Send Reset Link";
        }
      } catch (error) {
        console.error("Password reset request error:", error);
        showResetMessage("Network error. Please check your connection and try again.");
        sendResetBtn.disabled = false;
        sendResetBtn.textContent = "Send Reset Link";
      }
    });

    // Allow Enter key to submit reset request
    resetEmailInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") {
        sendResetBtn.click();
      }
    });
  
    const fillDemoBtn = document.getElementById("fillDemoBtn");
    if (fillDemoBtn) {
      fillDemoBtn.addEventListener("click", () => {
        emailInput.value = "admin@wsms.pk";
        passwordInput.value = "SuperAdmin2026!";
        hideError();
      });
    }

  </script>
</body>
</html>
