</div> <script> async function logout() { await fetch('../api/admin/logout.php', { method: 'POST', credentials: 'include' }); location.href = './'; } async function saveSettings() { const email = document.getElementById('email').value.trim(); const password = document.getElementById('pass').value.trim(); const payload = {}; if (email !== '') payload.email = email; if (password !== '') payload.password = password; if (Object.keys(payload).length === 0) { alert('Nothing to update'); return; } const res = await fetch('../api/admin/settings.php', { method: 'POST', credentials: 'include', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) }); const data = await res.json().catch(() => ({success:false})); if (data.success) { alert('Settings updated'); } else { alert(data.error || 'Failed to update'); } } document.querySelector('.saveBtn').addEventListener('click', saveSettings); </script> </body> </html>
