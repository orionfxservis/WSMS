<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Suppliers</title>
  <link rel="stylesheet" href="../assets/css/admin.css">
  <script src="../assets/js/session-check.js"></script>
  <script src="../assets/js/admin-theme.js"></script>
  <script src="../assets/js/admin-active-link.js"></script>
  <script src="../assets/js/admin-header-functions.js"></script>
</head>
<body>
  <div class="admin-layout">
    <div class="header">
      <div class="header-left">
        <a href="dashboard.html" class="header-brand">
          <img src="../assets/img/logo/logo.png" alt="WSMS Logo" onerror="this.src='../logo.png'" />
          <span style="font-size:18px;font-weight:700;color:var(--text-color,#ffffff);letter-spacing:0.3px;white-space:nowrap;">Super Admin</span>
        </a>
      </div>
      <div class="header-right">
        <div class="notification-bell" onclick="toggleNotifications()">
          <svg viewBox="0 0 24 24">
            <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25-2.5 9.5-2.5 9.5h15S19 14.25 19 9c0-3.87-3.13-7-7-7zm0 2c2.76 0 5 2.24 5 5 0 4.67 2 8.5 2 8.5H5s2-3.83 2-8.5c0-2.76 2.24-5 5-5zm-1 15h2v2h-2v-2z"/>
          </svg>
          <span class="notification-badge" id="notificationBadge" style="display: none;">0</span>
          <div class="notification-dropdown" id="notificationDropdown"></div>
        </div>
        <div class="user-menu">
          <div class="profile-menu-trigger" onclick="toggleProfileMenu()">
            <img src="../assets/img/dp.jpg" alt="Super Admin Avatar" onerror="this.src='../assets/default-user.png'" />
          </div>
          <div class="profile-dropdown" id="profileDropdown">
            <div class="profile-dropdown-header">
              <img src="../assets/img/dp.jpg" alt="Super Admin Avatar" onerror="this.src='../assets/default-user.png'" />
              <div>
                <div class="profile-name" id="profileName">Super Admin</div>
                <div class="profile-email" id="profileEmail">admin@wsms.com</div>
              </div>
            </div>
            <div class="profile-dropdown-menu">
              <div class="profile-menu-section">
                <div class="profile-menu-section-title">Account</div>
                <a href="settings.html">Settings</a>
                <a href="profile.html">Profile</a>
              </div>
              <div class="profile-menu-section">
                <div class="profile-menu-section-title">Theme</div>
                <div class="theme-toggle-item">
                  <span>Dark Mode</span>
                  <label class="theme-toggle-switch">
                    <input type="checkbox" id="themeToggle" onchange="toggleTheme()">
                    <span class="theme-toggle-slider"></span>
                  </label>
                  <span class="theme-toggle-label" id="themeLabel">Off</span>
                </div>
              </div>
              <div class="profile-menu-section">
                <a href="#" class="profile-menu-logout" onclick="logout(); return false;">Logout</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="layout">
      <aside class="sidebar">
        <div class="nav">
          <a href="dashboard.html">Dashboard</a>
          <a href="pending.html">Pending Requests</a>
          <a href="suppliers.html">Suppliers</a>
          <a href="stations.html">Stations</a>
          <a href="expenses.html">Expenses</a>
          <a href="reports.html">Reports</a>
          <a href="users.html">User Management</a>
          <a href="subscriptions/subscription-plans.html">Subscriptions</a>
          <a href="audit-logs.html">Audit Logs</a>
        </div>
              <div style="margin-top:auto;padding:15px;border-top:1px solid rgba(255,255,255,0.08);">
          <a href="../index.html" style="color:#70e0a1;font-size:13px;display:flex;align-items:center;gap:6px;text-decoration:none;">
            <span>← Public Portal</span>
          </a>
        </div>
      </aside>
      <main class="admin-main">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h1 style="margin: 0; font-size: 24px;">Suppliers</h1>
        <button class="btn btn-primary" onclick="openAddSupplierModal()" style="padding: 10px 20px;">Add Supplier</button>
      </div>
      
      <div class="table-container">
        <div class="table-header">All Suppliers</div>
        <table class="admin-table">
          <thead>
            <tr>
              <th class="admin-table-header">ID</th>
              <th class="admin-table-header">Name</th>
              <th class="admin-table-header">Email</th>
              <th class="admin-table-header">Status</th>
              <th class="admin-table-header">Created On</th>
              <th class="admin-table-header">Actions</th>
            </tr>
          </thead>
          <tbody id="suppliersBody">
            <tr class="admin-table-row"><td colspan="6" class="admin-empty-state">Loading…</td></tr>
          </tbody>
        </table>
      </div>
      </main>
    </div>
  </div>

  <!-- Add Supplier Modal - Using unified modal system -->

  <script src="../assets/js/session-check.js"></script>
  <script src="../assets/js/admin-mock-engine.js"></script>
  <script src="../assets/js/admin.js"></script>
  <script src="../assets/js/unified-modal.js"></script>
  <script src="../assets/js/admin-actions.js"></script>
  <script>
    // Global reload function for admin-actions.js
    function reloadData() {
      loadSuppliers();
    }
    
    // Edit functionality is handled by openEditExternalAccountModal() in admin-actions.js
    // It redirects to supplier-edit.html after warning confirmation
    
    async function loadSuppliers() {
      try {
        const res = await fetch('/wsms/api/admin/suppliers.php', {
          credentials: 'include'
        });
        const data = await res.json().catch(() => ({success: false}));
        const tbody = document.getElementById('suppliersBody');
        tbody.innerHTML = '';

        if (!data.success || !Array.isArray(data.suppliers)) {
          tbody.innerHTML = '<tr class="admin-table-row"><td colspan="6" class="admin-empty-state">Failed to load</td></tr>';
          return;
        }

        if (data.suppliers.length === 0) {
          tbody.innerHTML = '<tr class="admin-table-row"><td colspan="6" class="admin-empty-state">No suppliers found</td></tr>';
          return;
        }

        tbody.innerHTML = data.suppliers.map(s => {
          const createdBy = s.created_by || 'user';
          const createdDate = formatDate(s.created_at);
          const statusBadge = formatStatusBadge(s.status);
          const actionButtons = generateActionButtons('supplier', s.id, createdBy, s.status);
          
          return `
            <tr class="admin-table-row">
              <td>${s.id}</td>
              <td>${s.name || 'N/A'}</td>
              <td>${s.email || 'N/A'}</td>
              <td>${statusBadge}</td>
              <td>${createdDate}</td>
              <td>${actionButtons}</td>
            </tr>
          `;
        }).join('');
      } catch (e) {
        console.error('Failed to load suppliers:', e);
        document.getElementById('suppliersBody').innerHTML = '<tr class="admin-table-row"><td colspan="6" class="admin-empty-state">Failed to load</td></tr>';
      }
    }

    function openAddSupplierModal() {
      openModal('addSupplierModal', {
        title: 'Add New Supplier',
        message: '',
        icon: null,
        customContent: `
          <div class="form-group">
            <label>Name:</label>
            <input type="text" id="supplierName" placeholder="Supplier name" required style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text);">
          </div>
          <div class="form-group" style="margin-top: 16px;">
            <label>Email:</label>
            <input type="email" id="supplierEmail" placeholder="supplier@example.com" required style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text);">
          </div>
          <div class="form-group" style="margin-top: 16px;">
            <label>Password:</label>
            <input type="password" id="supplierPassword" placeholder="Minimum 8 characters" required style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text);">
          </div>
        `,
        buttons: [
          {
            id: 'create',
            text: 'Create Supplier',
            class: 'btn btn-primary',
            onClick: () => createSupplier()
          },
          {
            id: 'cancel',
            text: 'Cancel',
            class: 'btn',
            onClick: () => closeModal('addSupplierModal')
          }
        ]
      });
      
      // Clear form fields
      setTimeout(() => {
        const nameInput = document.getElementById('supplierName');
        const emailInput = document.getElementById('supplierEmail');
        const passwordInput = document.getElementById('supplierPassword');
        if (nameInput) nameInput.value = '';
        if (emailInput) emailInput.value = '';
        if (passwordInput) passwordInput.value = '';
      }, 100);
    }

    async function createSupplier() {
      const name = document.getElementById('supplierName').value.trim();
      const email = document.getElementById('supplierEmail').value.trim();
      const password = document.getElementById('supplierPassword').value;

      if (!name || !email || !password) {
        alert('Please fill in all fields');
        return;
      }

      if (password.length < 8) {
        alert('Password must be at least 8 characters long');
        return;
      }

      try {
        const res = await fetch('/wsms/api/auth.php?action=create_user', {
          method: 'POST',
          credentials: 'include',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            name: name,
            email: email,
            password: password,
            role: 'supplier'
          })
        });
        const data = await res.json();
        
        if (data.success || data.message) {
          closeModal('addSupplierModal');
          loadSuppliers();
          openModal('supplierCreatedSuccess', {
            title: 'Success',
            message: 'Supplier created successfully.',
            icon: 'success',
            buttons: [{
              id: 'ok',
              text: 'OK',
              class: 'btn btn-primary',
              onClick: () => closeModal('supplierCreatedSuccess')
            }]
          });
        } else {
          alert(data.error || 'Failed to create supplier');
        }
      } catch (e) {
        console.error('Failed to create supplier:', e);
        alert('Failed to create supplier');
      }
    }

    // Note: Modal closing is handled by unified-modal.js

    // Initialize page
    loadSuppliers();
  </script>
</body>
</html>
