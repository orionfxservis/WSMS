  <body class="bg-[#f7f9fb] text-[#222222] antialiased selection:bg-[#007bdb] selection:text-white">
    <div id="root"></div>

    <!-- Universal Zero-NPM Application Loader: Works on file:///, GitHub Pages, and all web servers -->
    <script>
      (function() {
        var appScript = document.createElement('script');
        if (location.protocol === 'file:') {
          // On local file:/// double-click, classic script avoids CORS null origin restriction
          appScript.src = './assets/app.js';
        } else {
          // On GitHub Pages / web servers, load with modern module tag with automatic fallback
          appScript.type = 'module';
          appScript.crossOrigin = '';
          appScript.src = './assets/app.js';
          appScript.onerror = function() {
            var fallback = document.createElement('script');
            fallback.src = './assets/app.js';
            document.body.appendChild(fallback);
          };
        }
        document.body.appendChild(appScript);
      })();
    </script>
  </body>
