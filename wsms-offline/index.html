    <meta charset="UTF-8" />

    <!-- Static compiled stylesheet for WSMS Sample 03 React App -->
    <link rel="stylesheet" href="./assets/app.css" />
  </head>
  <body class="bg-[#f7f9fb] text-[#222222] antialiased selection:bg-[#007bdb] selection:text-white">
    <div id="root"></div>

    <!-- Production Standalone React Bundle (Sample 03 - Zero NPM Required) -->
    <script type="module" src="./assets/app.js"></script>

    <!-- Fallback runner for local file:/// double-click if browser blocks modules over local filesystem -->
    <script>
      (function() {
        function checkAndMount() {
          var root = document.getElementById('root');
          if (root && (!root.firstElementChild || root.children.length === 0)) {
            var s = document.createElement('script');
            s.src = './assets/app.js';
            document.body.appendChild(s);
          }
        }
        if (location.protocol === 'file:') {
          if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', function() {
              setTimeout(checkAndMount, 150);
            });
          } else {
            setTimeout(checkAndMount, 150);
          }
        }
      })();
    </script>
  </body>
</html>
